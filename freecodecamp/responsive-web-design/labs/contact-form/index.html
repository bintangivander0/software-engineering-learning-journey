<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
    <div class="form-container">
        <form>
            <h2 class="bangers-regular">Hubungi kami</h2>
            <label for="nama-lengkap" class="unkempt-regular">Nama:</label>
            <input 
                type="text" 
                id="nama-lengkap" 
                name="nama-lengkap"
                placeholder="Budi Setiawan"
                required/>
            <label for="email" class="unkempt-regular">Email:</label>
            <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="example@link.com"
                required/>
            <label for="pesan" class="unkempt-regular">Pesan:</label>
            <textarea 
                id="pesan" 
                name="pesan" 
                rows="3" 
                cols"30"
                placeholder="tetap semangat!"
                required></textarea>
            <button type="submit" class="bangers-regular">Submit</button>
        </form>
    </div>
</body>

</html>
