<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Feature Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 class="google-sans-flex-h1">Feature Selection</h1>
    <div class="feature-card-container">
        <label for="ai-assistant" class="feature-card">
            <h2 class="google-sans-flex-h2">Asisten AI Multimedia</h2>
            <p class="google-sans-flex-p">Pemrosesan perintah teks, suara, dan visual real-time</p>
            <input type="checkbox" id="ai-assistant" name="fitur-tambahan"/>
        </label>
        <label for="spatial-computing" class="feature-card">
            <h2 class="google-sans-flex-h2">Spatial Workspace</h2>
            <p class="google-sans-flex-p">Dukungan ruang kerja 3D untuk headset AR/VR</p>
            <input type="checkbox" id="spatial-computing" name="fitur-tambahan"/>
        </label>
        <label for="cloud-storage" class="feature-card">
            <h2 class="google-sans-flex-h2">Cloud Storage 10TB</h2>
            <p class="google-sans-flex-p">Penyimpanan terdesentralisasi dengan keamanan enkripsi</p>
            <input type="checkbox" id="cloud-storage" name="fitur-tambahan"/>
        </label>
        <label for="iot-integration" class="feature-card">
            <h2 class="google-sans-flex-h2">Integrasi IoT Smart Home</h2>
            <p class="google-sans-flex-p">Sinkronisasi otomatis ke seluruh perangkat rumah pintar</p>
            <input type="checkbox" id="iot-integration" name="fitur-tambahan"/>
        </label>
        <label for="priority-support" class="feature-card">
            <h2 class="google-sans-flex-h2">Dukungan Prioritas 24/7</h2>
            <p class="google-sans-flex-p">Akses langsung ke teknisi tanpa antrean bot</p>
            <input type="checkbox" id="priority-support" name="fitur-tambahan"/>
        </label>
    </div>
</body>
